version: v3
teleport:
  nodename: teleport
  data_dir: /var/lib/teleport
  # Health endpoints for the compose healthcheck (/readyz); not published
  diag_addr: 0.0.0.0:3000
  log:
    output: stderr
    severity: INFO

auth_service:
  enabled: true
  cluster_name: teleport.localhost
  listen_addr: 0.0.0.0:3025
  proxy_listener_mode: multiplex
  license_file: /etc/teleport/license.pem

proxy_service:
  enabled: true
  web_listen_addr: 0.0.0.0:3080
  # Same name in the browser (loopback) and in containers (network alias)
  public_addr: teleport.localhost:3080
  https_keypairs:   # mkcert, from `make certs`
    - key_file: /etc/teleport/certs/localhost-key.pem
      cert_file: /etc/teleport/certs/localhost.pem

ssh_service:
  enabled: true
  labels:
    env: docker

db_service:
  enabled: true
  databases:
    - name: postgres
      protocol: postgres
      uri: postgres:5432   # TLS cert issued by teleport-setup
      static_labels:
        env: docker

kubernetes_service:
  enabled: true
  listen_addr: 0.0.0.0:3027   # the proxy (same process) dials this
  # k3s's admin kubeconfig, rewritten by the k3s-kubeconfig service; each
  # context (`k3s`) becomes a Kubernetes cluster of that name
  kubeconfig_file: /etc/teleport/kube/kubeconfig.yaml
  labels:
    env: docker

# EC2 auto-discovery. Runs the discovery_configs in this group, which
# terraform/aws-discovery creates. Its AWS API calls go to the simulated AWS
# account (AWS_ENDPOINT_URL in docker-compose.yml).
discovery_service:
  enabled: true
  # The group Teleport's web UI uses in its Terraform flow (and on Teleport
  # Cloud); teleport_discovery_group_name in terraform/aws-discovery.
  discovery_group: cloud-discovery-group
  poll_interval: 1m   # default 5m; shorter so new instances show up quickly
