<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Label}}</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #f5f5f6; color: #1d1d21;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { background: #fff; border: 1px solid #e1e1e5; border-radius: 6px; padding: 32px 40px; max-width: 420px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; } p { color: #6e6e78; margin: 0; }
  code { font: 12.5px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
  <div class="card">
    <h1>{{.Label}}</h1>
    <p>You launched this simulated Okta app (<code>{{.ID}}</code>). There's nothing else here.</p>
  </div>
</body>
</html>
