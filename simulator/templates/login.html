<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify it's you</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #1f2933; --muted: #5f6b7a;
    --border: #dde1e6; --row-hover: #f5f8f3; --accent: #3d8b37; --accent-dark: #2f6f2a;
    --focus: #1a73e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card);
    border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    padding: 32px 32px 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand svg { width: 28px; height: 28px; }
  .brand span { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  .sp { color: var(--muted); font-size: 12px; margin: -14px 0 22px; word-break: break-all; }
  form { margin: 0; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  button.row {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--card);
    transition: border-color .12s, background .12s;
  }
  button.row:hover { border-color: var(--accent); background: var(--row-hover); }
  button.row:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .avatar {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 600; font-size: 14px;
    color: #fff; background: var(--accent);
  }
  .who { flex: 1; min-width: 0; }
  .who strong { display: block; font-weight: 600; }
  .who small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { flex: none; color: var(--muted); }
  .divider { border: 0; border-top: 1px solid var(--border); margin: 24px 0 14px; }
  .foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .foot a { color: var(--accent-dark); text-decoration: none; }
  .secured { margin-top: 18px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .secured svg { width: 12px; height: 12px; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 4 5v6c0 5 3.4 9.5 8 11 4.6-1.5 8-6 8-11V5l-8-3Z" fill="#3d8b37"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Simulator</span>
    </div>
    <h1>Verify it's you</h1>
    <p class="sub">Choose an account to continue. No password needed.</p>
    {{if .SP}}<p class="sp">Signing in to {{.SP}}</p>{{end}}
    <form method="post">
      <input type="hidden" name="SAMLRequest" value="{{.SAMLRequest}}">
      <input type="hidden" name="RelayState" value="{{.RelayState}}">
      <div class="list">
        {{range .Users}}
        <button class="row" type="submit" name="user" value="{{.ID}}">
          <span class="avatar">{{.Initials}}</span>
          <span class="who"><strong>{{.DisplayName}}</strong><small>{{.Email}} · {{.Title}}</small></span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        {{end}}
      </div>
    </form>
    <hr class="divider">
    <div class="foot"><span>Other options</span><a href="#" onclick="return false">Need help?</a></div>
  </main>
  <div class="secured">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"/></svg>
    Secured by Simulator
  </div>
</body>
</html>
