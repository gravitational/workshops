<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In</title>
<style>
  :root {
    --bg: #f5f5f6; --card: #ffffff; --text: #1d1d21; --muted: #6e6e78;
    --border: #d7d7dc; --primary: #1662dd; --primary-dark: #0e4fb5; --hover: #f2f6fd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 64px 16px 24px;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--card);
    border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 2px 0 rgba(175,175,175,.12);
  }
  .head { padding: 32px 40px 24px; border-bottom: 1px solid #eaeaed; text-align: center; }
  .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; color: var(--text); }
  .logo svg { width: 28px; height: 28px; }
  .body { padding: 28px 40px 32px; }
  h1 { font-size: 20px; font-weight: 600; text-align: center; margin: 0 0 6px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 13px; }
  .sp { text-align: center; color: var(--muted); font-size: 12px; margin: -14px 0 20px; word-break: break-all; }
  form { margin: 0; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  button.row {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 4px; background: var(--card);
    transition: border-color .12s, background .12s;
  }
  button.row:hover { border-color: var(--primary); background: var(--hover); }
  button.row:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .avatar {
    flex: none; width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 600; font-size: 13px;
    color: #fff; background: var(--primary);
  }
  .who { flex: 1; min-width: 0; }
  .who strong { display: block; font-weight: 600; }
  .who small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .go { flex: none; font-size: 13px; font-weight: 600; color: var(--primary); }
  .foot { padding: 14px 40px; border-top: 1px solid #eaeaed; font-size: 13px; }
  .foot a { color: var(--primary); text-decoration: none; }
  .powered { margin-top: 18px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#1662dd" stroke-width="4"/></svg>
        Simulator
      </span>
    </div>
    <div class="body">
      <h1>Sign In</h1>
      <p class="sub">Select an account. No password required.</p>
      {{if .SP}}<p class="sp">to {{.SP}}</p>{{end}}
      <form method="post">
        <input type="hidden" name="SAMLRequest" value="{{.SAMLRequest}}">
        <input type="hidden" name="RelayState" value="{{.RelayState}}">
        <div class="list">
          {{range .Users}}
          <button class="row" type="submit" name="user" value="{{.ID}}">
            <span class="avatar">{{.Initials}}</span>
            <span class="who"><strong>{{.DisplayName}}</strong><small>{{.UserName}}</small></span>
            <span class="go">Sign in</span>
          </button>
          {{end}}
        </div>
      </form>
    </div>
    <div class="foot"><a href="#" onclick="return false">Help</a></div>
  </main>
  <div class="powered">Powered by Simulator</div>
</body>
</html>
