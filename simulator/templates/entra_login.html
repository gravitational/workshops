<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to your account</title>
<style>
  :root { --bg: #f2f2f2; --card: #fff; --text: #1b1b1b; --muted: #616161; --line: #e6e6e6; --hover: #f0f6fc; --accent: #0067b8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.45 "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px;
  }
  .card { width: 100%; max-width: 440px; background: var(--card); padding: 44px 44px 32px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; color: var(--muted); margin-bottom: 18px; }
  .brand svg { width: 20px; height: 20px; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; word-break: break-all; }
  form { margin: 0; }
  .list { border-top: 1px solid var(--line); }
  button.row {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: flex; align-items: center; gap: 14px; padding: 12px 8px;
    border-bottom: 1px solid var(--line);
  }
  button.row:hover { background: var(--hover); }
  button.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
            background: #e1e1e1; color: #444; font-weight: 600; font-size: 14px; }
  .who { flex: 1; min-width: 0; }
  .who strong { display: block; font-weight: 600; }
  .who small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot { margin-top: 18px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <div class="brand" aria-hidden="true">
      <svg viewBox="0 0 20 20"><rect x="1" y="1" width="8.5" height="8.5" fill="#7a7a7a"/><rect x="10.5" y="1" width="8.5" height="8.5" fill="#9a9a9a"/><rect x="1" y="10.5" width="8.5" height="8.5" fill="#9a9a9a"/><rect x="10.5" y="10.5" width="8.5" height="8.5" fill="#7a7a7a"/></svg>
      Simulator
    </div>
    <h1>Pick an account</h1>
    <p class="sub">{{if .SP}}to continue to {{.SP}}{{else}}No password required.{{end}}</p>
    <form method="post">
      <input type="hidden" name="SAMLRequest" value="{{.SAMLRequest}}">
      <input type="hidden" name="RelayState" value="{{.RelayState}}">
      <div class="list">
        {{range .Users}}
        <button class="row" type="submit" name="user" value="{{.ID}}">
          <span class="avatar">{{.Initials}}</span>
          <span class="who"><strong>{{.DisplayName}}</strong><small>{{.UserName}}</small></span>
        </button>
        {{end}}
      </div>
    </form>
    <p class="foot">Signed in through the Entra ID simulator. No password required.</p>
  </main>
</body>
</html>
