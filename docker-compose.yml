  k3s:
    image: rancher/k3s:v1.33.13-k3s2
    container_name: k3s
    hostname: k3s
    restart: unless-stopped
    privileged: true
    tmpfs: [/run, /var/run]
    command: ["server", "--tls-san", "k3s", "--disable", "traefik", "--disable", "metrics-server"]
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml   # admin kubeconfig, server 127.0.0.1
      K3S_KUBECONFIG_MODE: "644"
      KUBECONFIG: /output/kubeconfig.yaml             # `docker compose exec k3s kubectl`
    volumes:
      # A volume, not ./data: k3s needs unix sockets and overlayfs, which
      # Docker Desktop's bind mounts don't support
      - k3s-data:/var/lib/rancher/k3s
      - ./data/k3s-kubeconfig:/output
      # k3s applies everything here on start: namespace demo and the CI's RBAC
      - ./k3s/manifests:/var/lib/rancher/k3s/server/manifests/demo:ro
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw", "/readyz"]
      interval: 3s
      start_period: 120s   # cold start pulls images and writes certs
      retries: 10

  # Teleport reaches k3s by its service name, and names the cluster after the
  # kubeconfig context, so rename `default` to `k3s`.
  k3s-kubeconfig:
    image: busybox:1.37
    container_name: k3s-kubeconfig
    depends_on:
      k3s:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        sed -e 's#https://127.0.0.1:6443#https://k3s:6443#'
        -e 's/: default$$/: k3s/'
        /k3s/kubeconfig.yaml > /kube/kubeconfig.yaml
    volumes:
      - ./data/k3s-kubeconfig:/k3s:ro
      - ./data/kube:/kube

  # Runs the GHES's queued workflow runs. Holds no Teleport credentials: each
  # job's tbot joins with the run's GitHub ID token.
  ci-runner:
    build:
      context: ./simulator
      dockerfile: cmd/ci-runner/Dockerfile
    container_name: ci-runner
    restart: unless-stopped
    init: true   # reap the tbot/kubectl/bash processes each job spawns
    depends_on:
      simulator:
        condition: service_healthy
      teleport-setup:
        condition: service_completed_successfully   # bot, role and join token exist
    environment:
      GITHUB_URL: https://github.localhost:11443
      SSL_CERT_DIR: /etc/ssl/certs:/mkcert-ca   # trust the GHES's and Teleport's mkcert certs
    volumes:
      - ./github/repo:/github-repo:ro           # checked out into each job's workspace
      - ./certs/ca:/mkcert-ca:ro

volumes:
  go-cache:
  k3s-data:                                       # cluster state (see `make clean`)
