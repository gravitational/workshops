name: teleport

# Published Compose stack: what customers run straight from the registry with
#
#   docker compose -f oci://public.ecr.aws/gravitational-staging/workshops/compose:latest up -d -y
#
# CI publishes this file (`docker compose publish --resolve-image-digests`)
# as the `compose` artifact, pinned to the simulator, teleport and ci-runner
# images built from the same commit. For local development use
# docker-compose.yml, which builds the images and bind-mounts the config for
# fast iteration.
#
# Unlike docker-compose.yml, this file uses no repo files: Teleport config and
# the simulated GitHub repo are baked into the images, and pg_hba.conf and the
# k3s manifests are inline below. Keep both files in sync when changing
# services.
#
# The host provides only:
#   ./license.pem   Teleport Enterprise license
#   ./certs/        mkcert certs (`make certs`)
# State is written to ./data, plus the k3s-data volume.
#
# Host paths use ${WORKSHOP_DIR:-${PWD}} instead of ./ because Compose
# resolves relative paths in an oci:// stack against its own cache directory,
# not the current directory. PowerShell has no PWD environment variable, so
# Windows users set WORKSHOP_DIR to the workshop directory.

services:
  simulator:
    image: ${WORKSHOP_IMAGE_PREFIX:-public.ecr.aws/gravitational-staging/workshops}/simulator:${WORKSHOP_IMAGE_TAG:-latest}
    container_name: simulator
    restart: unless-stopped
    ports:
      - "8443:8443"   # Duo-style IdP (browser)
      - "9443:9443"   # Okta org (browser)
      - "10443:443"   # Entra ID tenant (browser only; Teleport uses the Microsoft names)
      # GitHub Enterprise Server (browser; the runner and Teleport use the network)
      - "127.0.0.1:11443:11443"
    networks:
      default:
        aliases:
          - duo.localhost
          - okta.localhost
          - entra.localhost
          - github.localhost
          - login.microsoftonline.com
          - graph.microsoft.com
    environment:
      SIMULATOR_URL: https://duo.localhost:8443
      SIMULATOR_DATA_DIR: /data
      SIMULATOR_CA_EXPORT_DIR: /ca
      SIMULATOR_TLS_CERT: /certs/localhost.pem
      SIMULATOR_TLS_KEY: /certs/localhost-key.pem
      SSL_CERT_DIR: /etc/ssl/certs:/mkcert-ca
      OKTA_URL: https://okta.localhost:9443
      ENTRA_LISTEN_ADDR: ":443"
      ENTRA_URL: https://entra.localhost:10443
      GITHUB_LISTEN_ADDR: ":11443"
      GITHUB_URL: https://github.localhost:11443
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-example-org/teleport-k8s-demo}
      GITHUB_REPO_DIR: /github-repo   # baked into the image
      SCIM_URL: https://teleport.localhost:3080/v1/webapi/scim/scim
      SCIM_TOKEN_FILE: /scim/token
    volumes:
      - ${WORKSHOP_DIR:-${PWD}}/data/simulator:/data
      - ${WORKSHOP_DIR:-${PWD}}/data/simulator-ca:/ca
      - ${WORKSHOP_DIR:-${PWD}}/data/scim-token:/scim:ro
      - ${WORKSHOP_DIR:-${PWD}}/certs:/certs:ro
      - ${WORKSHOP_DIR:-${PWD}}/certs/ca:/mkcert-ca:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/simulator", "-healthcheck"]
      interval: 3s
      start_period: 10s

  teleport:
    image: ${WORKSHOP_IMAGE_PREFIX:-public.ecr.aws/gravitational-staging/workshops}/teleport:${WORKSHOP_IMAGE_TAG:-latest}
    container_name: teleport
    hostname: teleport
    restart: unless-stopped
    networks:
      default:
        aliases:
          - teleport.localhost
    depends_on:
      simulator:
        condition: service_healthy   # Teleport fetches SAML metadata at bootstrap
      k3s-kubeconfig:
        condition: service_completed_successfully   # kubernetes_service reads it at start
    command: ["--bootstrap", "/etc/teleport/bootstrap.yaml"]
    environment:
      SSL_CERT_DIR: /etc/ssl/certs:/mkcert-ca:/simulator-ca
    ports:
      - "3080:3080"
    volumes:
      - ${WORKSHOP_DIR:-${PWD}}/license.pem:/etc/teleport/license.pem:ro
      - ${WORKSHOP_DIR:-${PWD}}/data/teleport:/var/lib/teleport
      - ${WORKSHOP_DIR:-${PWD}}/data/simulator-ca:/simulator-ca:ro
      - ${WORKSHOP_DIR:-${PWD}}/data/kube:/etc/teleport/kube:ro   # written by k3s-kubeconfig
      - ${WORKSHOP_DIR:-${PWD}}/certs:/etc/teleport/certs:ro
      - ${WORKSHOP_DIR:-${PWD}}/certs/ca:/mkcert-ca:ro
    healthcheck:   # diag_addr in teleport.yaml; not published
      test: ["CMD", "/busybox/wget", "-q", "-O-", "http://127.0.0.1:3000/readyz"]
      interval: 3s
      start_period: 120s

  teleport-setup:
    image: ${WORKSHOP_IMAGE_PREFIX:-public.ecr.aws/gravitational-staging/workshops}/teleport:${WORKSHOP_IMAGE_TAG:-latest}
    container_name: teleport-setup
    depends_on:
      teleport:
        condition: service_healthy   # Auth must be up before tctl runs
    network_mode: service:teleport
    entrypoint: ["/busybox/sh", "/setup.sh"]
    environment:
      SSL_CERT_DIR: /etc/ssl/certs:/mkcert-ca
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-example-org/teleport-k8s-demo}   # the join token allows this repo
    volumes:
      - ${WORKSHOP_DIR:-${PWD}}/data/teleport:/var/lib/teleport
      - ${WORKSHOP_DIR:-${PWD}}/data/scim-token:/scim
      - ${WORKSHOP_DIR:-${PWD}}/data/pg-certs:/pg-certs
      - ${WORKSHOP_DIR:-${PWD}}/certs:/etc/teleport/certs:ro
      - ${WORKSHOP_DIR:-${PWD}}/certs/ca:/mkcert-ca:ro

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    depends_on:
      teleport-setup:
        condition: service_completed_successfully   # needs the TLS cert
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - ssl_ca_file=/certs/server.cas
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust   # no password; pg_hba.conf requires certs
    configs:
      - source: pg_hba
        target: /etc/postgresql/pg_hba.conf
    volumes:
      - ${WORKSHOP_DIR:-${PWD}}/data/pg-certs:/certs:ro
      - ${WORKSHOP_DIR:-${PWD}}/data/postgres:/var/lib/postgresql/data

  k3s:
    image: rancher/k3s:v1.33.13-k3s2
    container_name: k3s
    hostname: k3s
    restart: unless-stopped
    privileged: true
    tmpfs: [/run, /var/run]
    command: ["server", "--tls-san", "k3s", "--disable", "traefik", "--disable", "metrics-server"]
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
      KUBECONFIG: /output/kubeconfig.yaml
    configs:
      # k3s applies everything in this directory on start
      - source: github_ci_rbac
        target: /var/lib/rancher/k3s/server/manifests/demo/github-ci-rbac.yaml
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ${WORKSHOP_DIR:-${PWD}}/data/k3s-kubeconfig:/output
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw", "/readyz"]
      interval: 3s
      start_period: 120s
      retries: 10

  # Teleport reaches k3s by its service name, and names the cluster after the
  # kubeconfig context, so rename `default` to `k3s`.
  k3s-kubeconfig:
    image: busybox:1.37
    container_name: k3s-kubeconfig
    depends_on:
      k3s:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        sed -e 's#https://127.0.0.1:6443#https://k3s:6443#'
        -e 's/: default$$/: k3s/'
        /k3s/kubeconfig.yaml > /kube/kubeconfig.yaml
    volumes:
      - ${WORKSHOP_DIR:-${PWD}}/data/k3s-kubeconfig:/k3s:ro
      - ${WORKSHOP_DIR:-${PWD}}/data/kube:/kube

  ci-runner:
    image: ${WORKSHOP_IMAGE_PREFIX:-public.ecr.aws/gravitational-staging/workshops}/ci-runner:${WORKSHOP_IMAGE_TAG:-latest}
    container_name: ci-runner
    restart: unless-stopped
    init: true
    depends_on:
      simulator:
        condition: service_healthy
      teleport-setup:
        condition: service_completed_successfully   # bot, role and join token exist
    environment:
      GITHUB_URL: https://github.localhost:11443
      SSL_CERT_DIR: /etc/ssl/certs:/mkcert-ca
    volumes:
      - ${WORKSHOP_DIR:-${PWD}}/certs/ca:/mkcert-ca:ro

volumes:
  k3s-data:

configs:
  pg_hba:
    # Same as postgres/pg_hba.conf.
    content: |
      local   all  all        trust
      hostssl all  all  all   cert
  github_ci_rbac:
    # Same as k3s/manifests/github-ci-rbac.yaml.
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: demo
        labels:
          pod-security.kubernetes.io/enforce: baseline
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: github-ci-deploy
        namespace: demo
      rules:
        - apiGroups: ["apps"]
          resources: ["deployments", "replicasets"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: github-ci-deploy
        namespace: demo
      subjects:
        - kind: Group
          name: github-ci
          apiGroup: rbac.authorization.k8s.io
      roleRef:
        kind: Role
        name: github-ci-deploy
        apiGroup: rbac.authorization.k8s.io
