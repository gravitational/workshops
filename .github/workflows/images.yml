name: CICD

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-images-${{ github.ref }}
  # Supersede stale PR runs; never cancel a publish on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: simulator/go.mod
          cache-dependency-path: simulator/go.sum
      - name: Test simulator
        working-directory: simulator
        run: |
          go test ./...
          go vet ./...
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.publish.yml config --quiet

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [simulator, teleport, ci-runner]
    env:
      IMAGE_PREFIX: public.ecr.aws/gravitational-staging/workshops
      # teleport-stage role created by the cloud-terraform workshop ECR stack.
      ROLE_ARN: arn:aws:iam::603330915152:role/workshops-github-action-ecr-role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - &assume_iam_role
        name: Assume publisher role
        if: github.ref_name == 'main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: workshops-${{ github.run_id }}
      - &public_ecr_login
        name: Log in to public ECR
        if: github.ref_name == 'main'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
      - name: Build and optionally push images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_name == 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Publishes compose.publish.yml as an OCI Compose artifact, pinned to the
  # image digests pushed by `build` for this commit. Customers run it with
  # `docker compose -f oci://<prefix>/compose:<tag> up`.
  publish-compose:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_PREFIX: public.ecr.aws/gravitational-staging/workshops
      ROLE_ARN: arn:aws:iam::603330915152:role/workshops-github-action-ecr-role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *assume_iam_role
      - *public_ecr_login
      - name: Publish Compose stack
        env:
          # Resolved to digests at publish time; the published file keeps the
          # variables, and an image-digests layer pins the images.
          WORKSHOP_IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          WORKSHOP_IMAGE_TAG: sha-${{ github.sha }}
          COMPOSE_FLAGS: ${{ github.ref_name == 'main' && '--resolve-image-digests' || '--dry-run' }}
          COMPOSE_IMAGE_PREFIX: ${{ github.ref_name == 'main' && env.IMAGE_PREFIX || 'dry-run' }}
        run: |
          docker compose version
          for tag in "sha-${GITHUB_SHA}" latest; do
            docker compose -f compose.publish.yml publish ${COMPOSE_FLAGS} --yes \
              "${COMPOSE_IMAGE_PREFIX}/compose:${tag}"
          done
